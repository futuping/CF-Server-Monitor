name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Merge upstream while preserving local commits
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          git merge --ff-only origin/main
          git remote add upstream https://github.com/huilang-me/CF-Server-Monitor.git
          git fetch --no-tags upstream main
          git merge --no-edit upstream/main

      - name: Install locked dependencies
        run: npm ci

      - name: Verify private monitor boundary
        run: node --test test/monitor-read-privacy.test.js

      - name: Run full regression
        run: npm run test:all

      - name: Publish verified merge
        run: |
          set -euo pipefail
          git push origin HEAD:main
